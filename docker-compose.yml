# Production: the Raspberry Pi. Both the Mac and the Pi are arm64, so the image
# built on one runs unmodified on the other.
#
# Migrations are NOT run on container start. A crash loop would otherwise become
# a migration loop against real data. `just deploy` runs them as a one-shot step.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: umai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: umai
    volumes: ["umai_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umai"]
      interval: 10s

  app:
    image: ${UMAI_IMAGE:-ghcr.io/OWNER/umai:latest}
    restart: unless-stopped
    env_file: [.env]
      # Inside the container, not on the host. Docker forwards the published
      # port over the bridge interface, so a process bound to the container's
      # own loopback is unreachable and every phone POST is refused — while the
      # healthcheck below, which curls from inside, passes regardless. The host
      # side of the mapping stays 127.0.0.1, which is where the security
      # property actually lives.
      UMAI_HTTP_HOST: 0.0.0.0
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes: ["${MEDIA_DIR:-./data/media}:/app/data/media"]
    # Loopback on purpose, and this is NOT the tailnet — an earlier version of
    # this comment claimed it was, which described a security property the file
    # did not have. Tailnet exposure is `tailscale serve` on the host, proxying
    # to this port, so the container never binds an interface the LAN can see:
    #   tailscale serve --bg --set-path /ingest/health http://127.0.0.1:8000/ingest/health
    # Path-scoped deliberately: a bare proxy would also publish /webhook/telegram
    # and /healthz to every device on the tailnet.
    ports: ["127.0.0.1:8000:8000"]

volumes:
  umai_data:
