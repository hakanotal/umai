[project]
name = "umai"
version = "0.1.0"
description = "Self-hosted personal nutrition and health assistant. Telegram front end, Raspberry Pi host."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "aiogram>=3.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "openai>=1.59",
    "pillow>=11.1",
    "matplotlib>=3.10",
    "apscheduler>=3.11",
    "structlog>=24.4",
    "httpx>=0.28",
    "numpy>=2.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umai"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py313"
# eval/ is a standalone harness with its own conventions, run before and
# independently of the application. It is not part of the package.
exclude = ["eval", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# the clock abstraction is the one place allowed to read the wall clock
"src/umai/clock.py" = ["DTZ005"]
# admin dashboard: Depends() in defaults is the standard FastAPI pattern,
# and the inline HTML string exceeds line length limits.
"src/umai/web/admin.py" = ["B008", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# see docs/technical-implementation.md section 8. everything takes a Clock.
"datetime.datetime.now".msg = "Use a Clock (src/umai/clock.py), never the wall clock directly."
"datetime.datetime.utcnow".msg = "Use a Clock (src/umai/clock.py), never the wall clock directly."

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true

# Strict only where a silent type error becomes a wrong calorie target.
# Spelled out rather than `strict = true`, which mypy applies globally even
# inside a per-module override.
[[tool.mypy.overrides]]
module = ["umai.analytics.*", "umai.resolver.*", "umai.core.*", "umai.telegram.*"]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# APScheduler ships no type stubs; its calls are few and guarded.
[[tool.mypy.overrides]]
module = ["apscheduler.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres via testcontainers",
]
